version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend/HotelBooking.API
      dockerfile: Dockerfile
    container_name: hotel-booking-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/hotelbooking.db
    volumes:
      - ./data:/app/data
    networks:
      - hotel-booking-network

  # Frontend Angular Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel-booking-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:80/api
    networks:
      - hotel-booking-network

networks:
  hotel-booking-network:
    driver: bridge

volumes:
  data:
